function switchLang(lang) {
  i18n.current = lang;
  localStorage.setItem('tinychat_lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  applyI18n();
  refreshChatI18n();
}

// Re-render dynamic (runtime-built) chat UI on language switch
function refreshChatI18n() {
  const sel = document.getElementById('privateTo');
  if (sel) {
    const cur = sel.value;
    renderMembers(lastMembers);
    sel.value = cur;
  }
  const hint = document.getElementById('privateMode');
  if (hint) {
    if (privateTo) { hint.style.display = 'inline'; hint.textContent = '❓ ' + i18n.t('privateHint').replace('{u}', privateTo); }
    else { hint.style.display = 'none'; }
  }
  const banner = document.getElementById('randomBanner');
  const status = document.getElementById('randomStatus');
  if (banner && status && banner.style.display !== 'none') {
    status.textContent = randomPeer ? ('🎲 ' + i18n.t('randomPaired') + ': ' + randomPeer) : ('🎲 ' + i18n.t('randomFinding'));
  }
  const rn = document.querySelector('.random-next'); if (rn) rn.textContent = i18n.t('randomNext');
  const rx = document.querySelector('.random-exit'); if (rx) rx.textContent = i18n.t('randomExit');
  const rb = document.getElementById('btnRandom'); if (rb) rb.textContent = i18n.t('randomBtn');
}

  document.querySelectorAll('.buy-close').forEach(b => b.textContent = i18n.t('buyClose'));
  const di = document.getElementById('dmInput'); if (di) di.placeholder = i18n.t('dmPlaceholder');
  const rb = document.getElementById('btnRandom'); if (rb) rb.textContent = i18n.t('randomBtn');
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (k) el.textContent = i18n.t(k); });
  const optPub = document.getElementById('optPublic'); if (optPub) optPub.textContent = i18n.t('selectPrivate');
  const dmB = document.getElementById('dmBtn'); if (dmB) dmB.textContent = i18n.t('dmBtn');
  const dmi = document.getElementById('dmInput'); if (dmi) dmi.placeholder = i18n.t('dmPlaceholder');
  const rn = document.querySelector('.random-next'); if (rn) rn.textContent = i18n.t('randomNext');
  const rx = document.querySelector('.random-exit'); if (rx) rx.textContent = i18n.t('randomExit');
}

let token = null;
let username = null;
let quota = -1;
let ws = null;
let reconnectTimer = null;
let reconnectAttempts = 0;
let manualClose = false;

function updateConnDot(state) {
  const dot = document.getElementById('connDot');
  if (!dot) return;
  if (state === 'green') { dot.style.background = '#1e8e3e'; dot.title = i18n.t('connected'); }
  else if (state === 'yellow') { dot.style.background = '#f9ab00'; dot.title = i18n.t('reconnecting'); }
  else { dot.style.background = '#d93025'; dot.title = i18n.t('disconnected'); }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  setActiveNav('navChat');
}

function showLogin() {
  showPage('pageLogin');
  document.getElementById('loginError').textContent = '';
}

function showRegister() {
  showPage('pageRegister');
  document.getElementById('regError').textContent = '';
}

async function api(path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api' + path, { method: 'POST', headers, body: JSON.stringify(body) });
  return await res.json();
}

async function doRegister() {
  const u = document.getElementById('regUsername').value.trim();
  const p = document.getElementById('regPassword').value;
  const e = document.getElementById('regEmail').value.trim();
  if (!u || !p) { document.getElementById('regError').textContent = i18n.t('registerError'); return; }
  const r = await api('/register', { username: u, password: p, email: e });
  if (r.ok) {
    document.getElementById('loginUsername').value = u;
    document.getElementById('loginPassword').value = p;
    showLogin();
  } else {
    document.getElementById('regError').textContent = r.error || i18n.t('registerError');
  }
}

async function doLogin() {
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value;
  if (!u || !p) { document.getElementById('loginError').textContent = i18n.t('loginError'); return; }
  const r = await api('/login', { username: u, password: p });
  if (r.ok) {
    token = r.token;
    username = r.username;
    quota = (typeof r.quota === 'number') ? r.quota : -1;
    startChat();
  } else {
    document.getElementById('loginError').textContent = r.error || i18n.t('loginError');
  }
}

function doLogout() {
  if (ws) { ws.close(); ws = null; }
  manualClose = true;
  token = null; username = null;
  const lo = document.getElementById('navLogout'); if (lo) lo.style.display = 'none';
  showPage('pageLogin');
  updateConnDot('red');
}

function connectWS() {
  manualClose = false;
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = proto + '//' + location.host + '/chat?token=' + encodeURIComponent(token);
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    reconnectAttempts = 0;
    updateConnDot('green');
    addMessage({ type: 'system', text: '✓ ' + i18n.t('connected') });
    if (localStorage.getItem('ugochat_auto_random') === '1') {
      localStorage.removeItem('ugochat_auto_random');
      setTimeout(() => startRandom(), 400);
    }
  };
  ws.onmessage = (e) => {
    try { handleWSMessage(JSON.parse(e.data)); } catch(err) {}
  };
  ws.onclose = () => {
    ws = null;
    if (manualClose) return;
    addMessage({ type: 'system', text: '⚠ ' + i18n.t('disconnected') + ' … ' + i18n.t('reconnecting') });
    updateConnDot('yellow');
    scheduleReconnect();
  };
  ws.onerror = () => {};
}

function scheduleReconnect() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  if (!token) { showRelogin(); return; }
  reconnectAttempts++;
  // 快速重连：前 3 次 1.5s，之后退避到最长 15s
  const delay = reconnectAttempts <= 3 ? 1500 : Math.min(1500 * Math.pow(2, reconnectAttempts - 2), 15000);
  reconnectTimer = setTimeout(() => {
    if (token && !manualClose) connectWS();
  }, delay);
}

function showRelogin() {
  addMessage({ type: 'system', text: '⛔ ' + i18n.t('sessionExpired') });
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'init':
      renderMembers(msg.onlineUsers.map(u => (typeof u === 'object' && u) ? u.username : u));
      const sel = document.getElementById('privateTo'); if (sel) sel.value = privateTo || '';
      document.getElementById('onlineCount').textContent = msg.onlineUsers.length;
      msg.messages.forEach(m => addMessage(m));
      document.getElementById('msgInput').disabled = false;
      document.getElementById('btnSend').disabled = false;
      addMessage({ type: 'system', text: '👋 ' + i18n.t('welcome') });
      break;
    case 'message': addMessage(msg); break;
    case 'online':
      { const un = (typeof msg.username === 'object' && msg.username) ? msg.username.username : msg.username; if (un !== username) addOnlineUser(un); }
      document.getElementById('onlineCount').textContent = msg.onlineUsers.length;
      break;
    case 'offline':
      { const un = (typeof msg.username === 'object' && msg.username) ? msg.username.username : msg.username; removeMember(un); }
      document.getElementById('onlineCount').textContent = msg.onlineUsers.length;
      break;
    case 'private': addPrivateMessage(msg); break;
    case 'random_paired': handleRandomPaired(msg.peer); break;
    case 'random_waiting':
      document.getElementById('randomStatus').textContent = '🎲 ' + i18n.t('randomWaiting');
      break;
    case 'random_peer_left':
      addMessage({ type: 'system', text: '🎲 ' + i18n.t('randomPeerLeft') });
      exitDirect();
      break;
    case 'random_msg': addRandomMessage(msg); break;
    case 'quota':
      if (typeof msg.quota === 'number') { quota = msg.quota; updateQuotaBadge(); }
      break;
    case 'system':
      if (msg.code === 'QUOTA_EXHAUSTED') { addMessage({ type: 'system', text: msg.text }); openBuy(); }
      else if (msg.text) addMessage({ type: 'system', text: msg.text });
      break;
  }
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !ws) return;
  if (quota === 0) { openBuy(); return; }
  // quota === -1 (无限) 或 >0 均可发送
  input.value = '';
  const to = privateTo;
  if (randomPeer) {
    // Random 1:1 mode: send to stranger only
    ws.send(JSON.stringify({ type: 'random_msg', text }));
    if (quota > 0) { quota -= 1; updateQuotaBadge(); }
    addRandomMessage({ direction: 'outgoing', text, timestamp: Date.now() });
    input.focus();
    return;
  }
  ws.send(JSON.stringify(to ? { type: 'private', to, text } : { type: 'message', text }));
  if (quota > 0) { quota -= 1; updateQuotaBadge(); }
  // Optimistic: show own message immediately
  if (to) {
    addPrivateMessage({ direction: 'outgoing', from: username, to, text, timestamp: Date.now() });
  } else {
    addMessage({ type: 'message', username, text, timestamp: Date.now() });
  }
  input.focus();
}

let privateTo = '';
function onSelectChange() {
  const sel = document.getElementById('privateTo');
  privateTo = sel.value || '';
  const dminp = document.getElementById('dmInput'); if (dminp) dminp.value = '';
  const hint = document.getElementById('privateMode');
  hint.style.display = privateTo ? 'inline' : 'none';
  if (privateTo) hint.textContent = '? ' + i18n.t('privateHint').replace('{u}', privateTo);
}
function applyDmInput() {
  const inp = document.getElementById('dmInput');
  const v = inp.value.trim();
  if (!v) { privateTo = ''; onSelectChangeReset(); return; }
  privateTo = v;
  const sel = document.getElementById('privateTo'); if (sel) sel.value = '';
  const hint = document.getElementById('privateMode');
  hint.style.display = 'inline';
  hint.textContent = '? ' + i18n.t('privateHint').replace('{u}', v);
}
function onSelectChangeReset() {
  const sel = document.getElementById('privateTo'); if (sel) sel.value = '';
  const hint = document.getElementById('privateMode');
  hint.style.display = 'none';
}
function addOnlineUser(user) {
  const sel = document.getElementById('privateTo');
  if (!user || sel.querySelector('option[value="' + user + '"]')) return;
  const opt = document.createElement('option');
  opt.value = user;
  opt.textContent = '✉ ' + user;
  sel.appendChild(opt);
}
function removeMember(user) {
  const opt = document.querySelector('#privateTo option[value="' + user + '"]');
  if (opt) opt.remove();
}
let lastMembers = [];
function renderMembers(users) {
  lastMembers = users || [];
  const sel = document.getElementById('privateTo');
  if (!sel) return;
  sel.innerHTML = '<option value="">' + i18n.t('selectPrivate') + '</option>';
  users.filter(u => u && u !== username).forEach(u => addOnlineUser(u));
}

let randomPeer = '';
function navChat() {
  exitDirect();
  if (token) { showPage('pageChat'); } else { showLogin(); }
}
function navRandom() {
  if (!token) { showLogin(); return; }
  if (ws && ws.readyState === 1) startRandom();
  else { localStorage.setItem('ugochat_auto_random', '1'); connectWS(); }
}
function setActiveNav(id) {
  ['navChat','navRandom','navAbout','navPricing'].forEach(n => {
    const e = document.getElementById(n); if (e) e.classList.remove('active');
  });
  const a = document.getElementById(id); if (a) a.classList.add('active');
}
function startRandom() {
  if (!ws) return;
  exitDirect();
  randomPeer = '';
  document.getElementById('randomBanner').style.display = 'flex';
  document.getElementById('randomStatus').textContent = i18n.t('randomFinding');
  ws.send(JSON.stringify({ type: 'random' }));
  addMessage({ type: 'system', text: '🎲 ' + i18n.t('randomFinding') });
}
function nextRandom() {
  if (!ws) return;
  randomPeer = '';
  document.getElementById('randomStatus').textContent = i18n.t('randomFinding');
  ws.send(JSON.stringify({ type: 'random_next' }));
}
function exitRandom() {
  if (ws) ws.send(JSON.stringify({ type: 'random_leave' }));
  exitDirect();
}
function exitDirect() {
  randomPeer = '';
  document.getElementById('randomBanner').style.display = 'none';
  privateTo = '';
  onSelectChangeReset();
}
function handleRandomPaired(peer) {
  randomPeer = peer;
  document.getElementById('randomBanner').style.display = 'flex';
  document.getElementById('randomStatus').textContent = '🎲 ' + i18n.t('randomPaired') + ': ' + peer;
  addMessage({ type: 'system', text: '🎲 ' + i18n.t('randomPaired') + ': ' + peer });
}
function addRandomMessage(msg) {
  const div = document.getElementById('messages');
  const isOutgoing = msg.direction === 'outgoing';
  const el = document.createElement('div');
  el.className = 'msg private' + (isOutgoing ? ' me' : '');
  const label = isOutgoing ? ('➡️ ' + i18n.t('randomPaired')) : ('🎲 Stranger');
  el.innerHTML = '<div class="sender">' + label + '</div>' + esc(msg.text) +
    '<div class="time">' + timeAgo(msg.timestamp) + '</div>';
  div.appendChild(el);
  div.scrollTop = div.scrollHeight;
}

function addMessage(msg) {
  const div = document.getElementById('messages');
  const el = document.createElement('div');
  if (msg.type === 'system') {
    el.className = 'msg system';
    el.textContent = msg.text;
  } else {
    el.className = 'msg' + (msg.username === username ? ' me' : '');
    const geo = msg.geo ? ' <span class="geo">(' + esc(msg.geo) + ')</span>' : '';
    el.innerHTML = '<div class="sender">' + esc(msg.username) + geo + '</div>' + esc(msg.text) +
      '<div class="time">' + timeAgo(msg.timestamp) + '</div>';
  }
  div.appendChild(el);
  div.scrollTop = div.scrollHeight;
}

function addPrivateMessage(msg) {
  const div = document.getElementById('messages');
  const el = document.createElement('div');
  const isOutgoing = msg.direction === 'outgoing';
  el.className = 'msg private' + (isOutgoing ? ' me' : '');
  const label = '🔒 ' + esc(msg.from) + ' → ' + esc(msg.to);
  const geo = msg.geo ? ' <span class="geo">(' + esc(msg.geo) + ')</span>' : '';
  el.innerHTML = '<div class="sender">' + label + geo + '</div>' + esc(msg.text) +
    '<div class="time">' + timeAgo(msg.timestamp) + '</div>';
  div.appendChild(el);
  div.scrollTop = div.scrollHeight;
}

function timeAgo(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

(function init() {
  const savedLang = localStorage.getItem('tinychat_lang');
  if (savedLang) i18n.current = savedLang;
  applyI18n();
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === i18n.current);
  });
  const savedToken = localStorage.getItem('tinychat_token');
  const savedUser = localStorage.getItem('tinychat_username');
  if (savedToken && savedUser) {
    token = savedToken;
    username = savedUser;
    startChat();
  }
})();

function startChat() {
  localStorage.setItem('tinychat_token', token);
  localStorage.setItem('tinychat_username', username);
  const lo = document.getElementById('navLogout'); if (lo) lo.style.display = 'inline';
  showPage('pageChat');
  document.getElementById('msgInput').disabled = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('messages').innerHTML = '';
  renderMembers([]);
  onSelectChangeReset();
  updateQuotaBadge();
  connectWS();
  document.getElementById('loginError').textContent = '';
  document.getElementById('regError').textContent = '';
}

function updateQuotaBadge() {
  const badge = document.getElementById('quotaBadge');
  const num = document.getElementById('quotaNum');
  if (!badge || !num) return;
  if (quota === -1) { num.textContent = '∞'; badge.className = 'quota-badge'; badge.title = '无限条'; return; }
  if (quota < 0) { num.textContent = '--'; badge.className = 'quota-badge'; return; }
  num.textContent = quota;
  if (quota <= 0) badge.className = 'quota-badge empty';
  else if (quota <= 10) badge.className = 'quota-badge low';
  else badge.className = 'quota-badge';
}

function openBuy() {
  const m = document.getElementById('buyModal');
  if (m) m.style.display = 'flex';
  const r = document.getElementById('buyResult');
  if (r) r.textContent = '';
}
function closeBuy() {
  const m = document.getElementById('buyModal');
  if (m) m.style.display = 'none';
}
async function doBuy(pkg) {
  const r = await api('/buy', { token, pkg });
  const res = document.getElementById('buyResult');
  if (r.ok) {
    quota = r.quota;
    updateQuotaBadge();
    if (res) res.textContent = '✓ ' + (r.label || '') + ' 已开通，' + (quota === -1 ? '无限条' : ('剩余 ' + quota + ' 条'));
    setTimeout(closeBuy, 1200);
  } else if (res) {
    res.textContent = '✗ ' + (r.error || i18n.t('buyFail'));
  }
}
window.addEventListener('load', () => {
  const badge = document.getElementById('quotaBadge');
  if (badge) badge.onclick = openBuy;
});
</script>
